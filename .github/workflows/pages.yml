name: 予約管理サイトを公開

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: ソースを取得
        uses: actions/checkout@v6
      - name: Pagesを準備
        uses: actions/configure-pages@v5
      - name: 公開ファイルを登録
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: GitHub Pagesへ公開
        id: deployment
        uses: actions/deploy-pages@v4
